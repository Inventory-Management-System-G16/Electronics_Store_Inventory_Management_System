name: ESIMS CI Pipeline
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Lint and syntax checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_DRIVER: sqlite
      SECRET_KEY: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt flake8
      - name: Syntax checks
        run: python -m compileall -q app.py seed_users.py tests
      - name: Lint
        run: flake8 app.py seed_users.py tests --max-line-length=120 --extend-ignore=E203,W503,E501
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_DRIVER: sqlite
      SECRET_KEY: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt flake8
      - name: Run unit and application tests
        run: pytest -v --ignore=tests/test_smoke.py --junitxml=test-results.xml
      - name: Upload junit-test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_DRIVER: sqlite
      SECRET_KEY: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt flake8
      - name: Check core application routes
        run: pytest -v tests/test_smoke.py --junitxml=smoke-results.xml
      - name: Upload smoke-test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: backend/smoke-results.xml
          if-no-files-found: ignore
  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_DRIVER: sqlite
      SECRET_KEY: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt flake8
      - name: Generate statement coverage report
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml
      - name: Upload coverage-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          if-no-files-found: ignore
      - name: Upload coverage-xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
  branch-coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_DRIVER: sqlite
      SECRET_KEY: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt flake8
      - name: Generate branch coverage report
        run: pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=html:branchcov --cov-report=xml:branch-coverage.xml
      - name: Display branch coverage percentage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("branch-coverage.xml").getroot()
          print("Branch coverage: {:.2%}".format(float(root.attrib["branch-rate"])))
          PY
      - name: Upload branch-coverage-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage-report
          path: backend/branchcov/
          if-no-files-found: ignore
      - name: Upload branch-coverage-xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage-xml
          path: backend/branch-coverage.xml
          if-no-files-found: ignore
