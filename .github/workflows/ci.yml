name: Sprint 1 CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt flake8
      - name: Lint
        working-directory: backend
        run: flake8 app.py seed_users.py tests --max-line-length=120 --extend-ignore=E203,W503,E501
      - name: Run tests
        working-directory: backend
        env:
          DB_DRIVER: sqlite
          SECRET_KEY: ci-only-test-secret
        run: pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore
