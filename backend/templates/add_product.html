<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ESIMS | Add Product</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="card wide"><nav><a href="{{ url_for('inventory') }}">Inventory</a><form method="post" action="{{ url_for('logout') }}"><button class="secondary" type="submit">Log out</button></form></nav><h1>Add product</h1>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><label for="product_id">Product ID *</label><input id="product_id" name="product_id" maxlength="30" required value="{{ values.product_id if values else '' }}"><label for="product_name">Product name *</label><input id="product_name" name="product_name" maxlength="100" required value="{{ values.product_name if values else '' }}"><label for="category">Category *</label><input id="category" name="category" maxlength="50" required value="{{ values.category if values else '' }}"><label for="price">Unit price *</label><input id="price" name="price" type="number" min="0" step="0.01" required value="{{ values.price if values else '' }}"><label for="quantity">Quantity *</label><input id="quantity" name="quantity" type="number" min="0" step="1" required value="{{ values.quantity if values else '' }}"><label for="reorder_level">Reorder level *</label><input id="reorder_level" name="reorder_level" type="number" min="0" step="1" required value="{{ values.reorder_level if values else '' }}"><label for="location">Location (optional)</label><input id="location" name="location" maxlength="50" value="{{ values.location if values else '' }}"><button type="submit">Save product</button></form></main></body></html>
