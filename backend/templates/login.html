<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ESIMS | Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="card"><h1>ESIMS</h1><p>Electronics Store Inventory Management System</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}"><label for="username">Username or email</label><input id="username" name="username" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Log in</button></form></main></body></html>
