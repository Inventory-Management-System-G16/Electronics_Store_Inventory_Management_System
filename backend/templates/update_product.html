<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESIMS | Update Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <nav>
        <a href="{{ url_for('inventory') }}">&larr; Back to inventory</a>

        <span>
            {{ session.get('username') }}
            ({{ session.get('role') }})
        </span>

        <form method="post" action="{{ url_for('logout') }}">
            <button class="secondary" type="submit">Log out</button>
        </form>
    </nav>

    <h1>Update Product</h1>

    <p class="subtitle">
        Update the details of an existing product
    </p>

    <form method="POST" class="update-form">
        {% if error %}
            <p class="error error-message" role="alert">
                {{ error }}
            </p>
        {% endif %}

        <label>Product ID</label>
        <input
            type="text"
            value="{{ product.product_id }}"
            readonly
        >

        <label>Product Name</label>
        <input
            type="text"
            name="product_name"
            value="{{ product.product_name }}"
            maxlength="100"
            required
        >

        <label>Category</label>
        <input
            type="text"
            name="category"
            value="{{ product.category }}"
            maxlength="50"
            required
        >

        <label>Price</label>
        <input
            type="number"
            name="price"
            step="0.01"
            min="0"
            value="{{ product.price }}"
            required
        >

        <label>Current Quantity</label>
        <input
            type="number"
            name="quantity"
            step="1"
            min="0"
            value="{{ product.quantity }}"
            required
        >

        <label>Reorder Level</label>
        <input
            type="number"
            name="reorder_level"
            step="1"
            min="0"
            value="{{ product.reorder_level }}"
            required
        >

        <label>Location</label>
        <input
            type="text"
            name="location"
            maxlength="50"
            value="{{ product.location or '' }}"
        >

        <div class="form-buttons">

            <button type="submit">
                Update Product
            </button>

            <a href="{{ url_for('inventory') }}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
